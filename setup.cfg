[flake8]
# Игнорируем E402 (module level import not at top of file)
# Это необходимо, так как в некоторых модулях импорты должны быть
# после модификации sys.path для корректной работы при прямом запуске
extend-ignore = E402
max-line-length = 119
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    venv,
    .mypy_cache,
    .pytest_cache

